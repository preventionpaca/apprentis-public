<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Gestion des apprentis — consultation</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7fbf9; }
    .viewport { position: fixed; inset: 0; overflow: hidden; background: #f7fbf9; }
    iframe {
      position: absolute;
      left: 0;
      top: -40px;
      width: 100%;
      height: calc(100% + 40px);
      border: 0;
      background: #f7fbf9;
    }
    @media (max-width: 700px) {
      iframe { top: -92px; height: calc(100% + 92px); }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <iframe id="app" title="Gestion des apprentis" referrerpolicy="no-referrer"></iframe>
  </div>
  <script>
    (function () {
      const gas = 'https://script.google.com/macros/s/' +
        'AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg' +
        '/exec';
      const frame = document.getElementById('app');
      /* Clé du lien Atrium : transmise à chaque page affichée dans le cadre. */
      const acces = new URLSearchParams(location.search).get('acces') || '';
      const jeton = new URLSearchParams(location.search).get('jeton') || '';
      const allowedPages = {
        'apprentissage-public-pfmp': true,
        'suivi-apprentis-enseignants': true,
        'cartographie-apprentis-public-pfmp': true
      };
      function allowed(raw) {
        try {
          const incoming = new URL(String(raw || ''));
          const page = incoming.searchParams.get('page') || '';
          if (incoming.protocol !== 'https:' ||
              !(incoming.hostname === 'script.google.com' || /script\.googleusercontent\.com$/i.test(incoming.hostname)) ||
              !allowedPages[page]) return null;
          const target = new URL(gas);
          incoming.searchParams.forEach(function (value, key) { target.searchParams.append(key, value); });
          if (acces && !target.searchParams.has('acces')) target.searchParams.set('acces', acces);
          if (jeton && !target.searchParams.has('jeton')) target.searchParams.set('jeton', jeton);
          target.searchParams.set('wrapper', '1');
          return target;
        } catch (e) { return null; }
      }
      function eucOrigine(){try{var d=sessionStorage.getItem('eucOrigine');if(d!==null)return null;var o='';try{o=document.referrer?new URL(document.referrer).hostname:'';}catch(e){}sessionStorage.setItem('eucOrigine',o||'-');return o;}catch(e){return null;}}
      function initial() {
        const target = new URL(gas);
        const query = new URLSearchParams(location.search);
        /* Nouveau suivi des apprentis par défaut ; l'ancienne page y mène aussi. */
        let page = query.get('page') || 'suivi-apprentis-enseignants';
        if (!allowedPages[page] || page === 'apprentissage-public-pfmp') page = 'suivi-apprentis-enseignants';
        target.searchParams.set('page', page);
        ['annee', 'classe', 'acces', 'jeton'].forEach(function (key) {
          const value = query.get(key);
          if (value) target.searchParams.set(key, value);
        });
        target.searchParams.set('wrapper', '1');
        /* Observation : origine du clic (ex. atrium-sud.fr), transmise une fois par onglet. */
        const o = eucOrigine(); if (o !== null) target.searchParams.set('orig', o);
        return target;
      }
      window.addEventListener('message', function (event) {
        if (!event.data || !/^EUC_(?:APPRENTIS|PFMP)_WRAPPER_/.test(String(event.data.type || ''))) return;
        if (event.origin !== 'null' &&
            !/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(event.origin) &&
            event.origin !== 'https://script.google.com') return;
        if (event.data.type === 'EUC_APPRENTIS_WRAPPER_QUERY') {
          try { event.source.postMessage({ type: 'EUC_APPRENTIS_WRAPPER_READY' }, '*'); } catch (e) {}
          return;
        }
        /* Le nouveau suivi des apprentis (même code que celui des PFMP) envoie EUC_PFMP_WRAPPER_NAVIGATE. */
        if (event.data.type === 'EUC_APPRENTIS_WRAPPER_NAVIGATE' || event.data.type === 'EUC_PFMP_WRAPPER_NAVIGATE') {
          const target = allowed(event.data.url);
          if (target) frame.src = target.toString();
        }
      });
      frame.src = initial().toString();
    }());
  </script>
</body>
</html>
