<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Gestion des apprentis — consultation</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7fbf9; }
    .viewport { position: fixed; inset: 0; overflow: hidden; background: #f7fbf9; }
    iframe {
      position: absolute;
      left: 0;
      top: -40px;
      width: 100%;
      height: calc(100% + 40px);
      border: 0;
      background: #f7fbf9;
    }
    @media (max-width: 700px) {
      iframe { top: -92px; height: calc(100% + 92px); }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <iframe id="app" title="Gestion des apprentis" referrerpolicy="no-referrer"></iframe>
  </div>
  <script>
    (function () {
      const gas = 'https://script.google.com/macros/s/' +
        'AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg' +
        '/exec';
      const target = new URL(gas);
      const query = new URLSearchParams(location.search);
      target.searchParams.set('page', 'apprentissage-public-pfmp');
      ['annee', 'classe'].forEach(function (key) {
        const value = query.get(key);
        if (value) target.searchParams.set(key, value);
      });
      document.getElementById('app').src = target.toString();
    }());
  </script>
</body>
</html>
